[neopixel LUCI]
pin: PE6
chain_count: 60
color_order: GRB
# Parto da spento, cosi' all'avvio non c'e' il lampo grigio prima del fade-in
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

# ---------------------------------------------------------------
# EFFETTI
# ---------------------------------------------------------------

# Accensione in dissolvenza (3 s): da spento a bianco
[led_effect FADE_IN]
autostart: false
frame_rate: 60
leds:
    neopixel:LUCI
layers:
    linearfade 3 0 top (0.0,0.0,0.0),(1.0,1.0,1.0)

# Spegnimento in dissolvenza (2 s): da bianco a spento
[led_effect FADE_OUT]
autostart: false
frame_rate: 60
leds:
    neopixel:LUCI
layers:
    linearfade 2 0 top (1.0,1.0,1.0),(0.0,0.0,0.0)

# Bianco fisso (stato "luci accese")
[led_effect IDLE]
autostart: false
frame_rate: 60
leds:
    neopixel:LUCI
layers:
    static 0 0 top (1.0,1.0,1.0)

# Effetto riscaldamento (rosso -> bianco)
[led_effect RISCALDA]
autostart: false
frame_rate: 60
leds:
    neopixel:LUCI
layers:
    gradient .5 1 top (1.0,0.0,0.0),(1.0,1.0,1.0)

# ---------------------------------------------------------------
# TIMER (non bloccano la coda dei movimenti, sicuri in stampa)
# ---------------------------------------------------------------

# A fine fade-in passa al bianco fisso
[delayed_gcode LUCI_FINE_FADE_IN]
gcode:
    SET_LED_EFFECT EFFECT=IDLE REPLACE=1

# A fine fade-out spegne tutti gli effetti
[delayed_gcode LUCI_FINE_FADE_OUT]
gcode:
    STOP_LED_EFFECTS

# ---------------------------------------------------------------
# AVVIO E MACRO
# ---------------------------------------------------------------

[delayed_gcode startup]
initial_duration: 1
gcode:
    Luci_ON

[gcode_macro Luci_ON]
gcode:
    UPDATE_DELAYED_GCODE ID=LUCI_FINE_FADE_OUT DURATION=0
    SET_LED_EFFECT EFFECT=FADE_IN REPLACE=1
    UPDATE_DELAYED_GCODE ID=LUCI_FINE_FADE_IN DURATION=1#2.95

[gcode_macro Luci_OFF]
gcode:
    UPDATE_DELAYED_GCODE ID=LUCI_FINE_FADE_IN DURATION=0
    SET_LED_EFFECT EFFECT=FADE_OUT REPLACE=1
    UPDATE_DELAYED_GCODE ID=LUCI_FINE_FADE_OUT DURATION=1#2
