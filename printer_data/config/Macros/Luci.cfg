[led STRIP]
white_pin: PB4          # il pin del connettore HE1 sulla tua scheda
cycle_time: 0.005
initial_WHITE: 0

[neopixel LUCI]
pin: PE6
chain_count: 60
color_order: GRB
# Parto da spento, cosi' all'avvio non c'e' il lampo grigio prima del fade-in
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

#####################################################################
# STATO INTERNO (solo variabili: non e' un effetto, non va chiamata
# direttamente)
#
# luci_max / strip_max = luminosita' massima delle due strisce
# (0.0-1.0). Tutte le macro qui sotto le usano al posto di un valore
# fisso: per regolare la luminosita' ovunque in un colpo solo, cambia
# questi due numeri qui sotto e riavvia Klipper (o FIRMWARE_RESTART).
#####################################################################
[gcode_macro _LUCI]
variable_state: "off"      # off | idle | heat | wait
variable_tick: 0
variable_cur_r: 0.0
variable_cur_g: 0.0
variable_cur_b: 0.0
variable_cur_w: 0.0
variable_luci_max: 1.0     # <-- luminosita' massima di LUCI (neopixel), 0.0-1.0
variable_strip_max: 0.5    # <-- luminosita' massima di STRIP (dimmerabile), 0.0-1.0
gcode:
    # contenitore di variabili

#####################################################################
# Dissolvenza: porta LUCI (RGB) e STRIP (W) dal valore attuale a
# quello target, in STEPS passi da 0.025s (STEPS=20 -> 0.5s,
# STEPS=10 -> 0.25s). Alla fine, se next_state e' "heat" o "wait",
# avvia l'animazione continua (_LUCI_TICK). Sostituisce il FADETIME
# di led_effects, ma ora muove insieme tutte e due le strisce.
#####################################################################
[gcode_macro _LUCI_FADE]
variable_from_r: 0.0
variable_from_g: 0.0
variable_from_b: 0.0
variable_from_w: 0.0
variable_to_r: 0.0
variable_to_g: 0.0
variable_to_b: 0.0
variable_to_w: 0.0
variable_step: 0
variable_steps: 20
variable_next_state: "idle"
gcode:
    {% set s = printer["gcode_macro _LUCI_FADE"] %}
    {% set t = (s.step + 1) / s.steps %}
    {% set r = s.from_r + (s.to_r - s.from_r) * t %}
    {% set g = s.from_g + (s.to_g - s.from_g) * t %}
    {% set b = s.from_b + (s.to_b - s.from_b) * t %}
    {% set w = s.from_w + (s.to_w - s.from_w) * t %}
    SET_LED LED=LUCI RED={"%.3f"|format(r)} GREEN={"%.3f"|format(g)} BLUE={"%.3f"|format(b)} TRANSMIT=1
    SET_LED LED=STRIP WHITE={"%.3f"|format(w)} TRANSMIT=1
    SET_GCODE_VARIABLE MACRO=_LUCI VARIABLE=cur_r VALUE={"%.3f"|format(r)}
    SET_GCODE_VARIABLE MACRO=_LUCI VARIABLE=cur_g VALUE={"%.3f"|format(g)}
    SET_GCODE_VARIABLE MACRO=_LUCI VARIABLE=cur_b VALUE={"%.3f"|format(b)}
    SET_GCODE_VARIABLE MACRO=_LUCI VARIABLE=cur_w VALUE={"%.3f"|format(w)}
    {% if s.step + 1 < s.steps %}
        SET_GCODE_VARIABLE MACRO=_LUCI_FADE VARIABLE=step VALUE={s.step + 1}
        UPDATE_DELAYED_GCODE ID=_LUCI_FADE_TICK DURATION=0.025
    {% else %}
        SET_GCODE_VARIABLE MACRO=_LUCI VARIABLE=state VALUE='"{s.next_state}"'
        SET_GCODE_VARIABLE MACRO=_LUCI VARIABLE=tick VALUE=0
        {% if s.next_state == "heat" or s.next_state == "wait" %}
            UPDATE_DELAYED_GCODE ID=_LUCI_TICK DURATION=0.1
        {% endif %}
    {% endif %}

[delayed_gcode _LUCI_FADE_TICK]
gcode:
    _LUCI_FADE

#####################################################################
# Avvia una dissolvenza verso (R,G,B,W) e imposta lo stato di arrivo
# (idle/off/heat/wait). R,G,B,W qui sono gia' i valori finali da
# raggiungere (le macro pubbliche li calcolano gia' scalati per
# luci_max/strip_max prima di chiamarmi).
#####################################################################
[gcode_macro _LUCI_GOTO]
gcode:
    {% set r = params.R|default(0)|float %}
    {% set g = params.G|default(0)|float %}
    {% set b = params.B|default(0)|float %}
    {% set w = params.W|default(0)|float %}
    {% set next_state = params.STATE|default("idle")|string %}
    {% set steps = params.STEPS|default(20)|int %}
    {% set l = printer["gcode_macro _LUCI"] %}
    SET_GCODE_VARIABLE MACRO=_LUCI_FADE VARIABLE=from_r VALUE={l.cur_r}
    SET_GCODE_VARIABLE MACRO=_LUCI_FADE VARIABLE=from_g VALUE={l.cur_g}
    SET_GCODE_VARIABLE MACRO=_LUCI_FADE VARIABLE=from_b VALUE={l.cur_b}
    SET_GCODE_VARIABLE MACRO=_LUCI_FADE VARIABLE=from_w VALUE={l.cur_w}
    SET_GCODE_VARIABLE MACRO=_LUCI_FADE VARIABLE=to_r VALUE={r}
    SET_GCODE_VARIABLE MACRO=_LUCI_FADE VARIABLE=to_g VALUE={g}
    SET_GCODE_VARIABLE MACRO=_LUCI_FADE VARIABLE=to_b VALUE={b}
    SET_GCODE_VARIABLE MACRO=_LUCI_FADE VARIABLE=to_w VALUE={w}
    SET_GCODE_VARIABLE MACRO=_LUCI_FADE VARIABLE=step VALUE=0
    SET_GCODE_VARIABLE MACRO=_LUCI_FADE VARIABLE=steps VALUE={steps}
    SET_GCODE_VARIABLE MACRO=_LUCI_FADE VARIABLE=next_state VALUE='"{next_state}"'
    _LUCI_FADE

#####################################################################
# Animazione continua per "heat" (RISCALDA) e "wait" (WAIT):
# 10 aggiornamenti al secondo invece dei 24-60 fps per-LED di
# led_effects. Onda triangolare (sale e scende linearmente), scalata
# per luci_max/strip_max ad ogni tick: cosi' se cambi LUCI_MAX o
# STRIP_MAX mentre un'animazione gira, si adegua subito.
# - heat: solo LUCI pulsa rosso<->bianco; STRIP resta spenta (l'ha
#   gia' spenta la dissolvenza prima di arrivare qui).
# - wait: LUCI e STRIP respirano insieme, stessa onda.
#####################################################################
[delayed_gcode _LUCI_TICK]
gcode:
    {% set l = printer["gcode_macro _LUCI"] %}
    {% if l.state == "heat" %}
        {% set period = 20 %}
        {% set cycle = (l.tick / period) | int %}
        {% set rem = l.tick - cycle * period %}
        {% set t = rem / period %}
        {% set tri = 1 - (2 * t - 1) | abs %}
        SET_LED LED=LUCI RED={"%.3f"|format(l.luci_max)} GREEN={"%.3f"|format(tri * l.luci_max)} BLUE={"%.3f"|format(tri * l.luci_max)} TRANSMIT=1
        SET_GCODE_VARIABLE MACRO=_LUCI VARIABLE=tick VALUE={l.tick + 1}
        UPDATE_DELAYED_GCODE ID=_LUCI_TICK DURATION=0.1
    {% elif l.state == "wait" %}
        {% set period = 30 %}
        {% set cycle = (l.tick / period) | int %}
        {% set rem = l.tick - cycle * period %}
        {% set t = rem / period %}
        {% set tri = 1 - (2 * t - 1) | abs %}
        SET_LED LED=LUCI RED={"%.3f"|format(tri * l.luci_max)} GREEN={"%.3f"|format(tri * l.luci_max)} BLUE={"%.3f"|format(tri * l.luci_max)} TRANSMIT=1
        SET_LED LED=STRIP WHITE={"%.3f"|format(tri * l.strip_max)} TRANSMIT=1
        SET_GCODE_VARIABLE MACRO=_LUCI VARIABLE=tick VALUE={l.tick + 1}
        UPDATE_DELAYED_GCODE ID=_LUCI_TICK DURATION=0.1
    {% endif %}
    # se lo stato e' diventato "idle" o "off" nel frattempo, qui non si
    # rischedula nulla e il tick si ferma da solo

#####################################################################
# MACRO PUBBLICHE - stessi nomi di prima, cosi' non devi toccare le
# altre macro (slicer, start/end, pause...) che le richiamano gia'.
# Tutte usano luci_max/strip_max invece di un valore fisso.
#####################################################################

# Fa quello che faceva il vecchio Luci_ON: entrambe le strisce si
# accendono insieme con un fade-in di 0.5s, alla luminosita' massima
# impostata.
[gcode_macro LUCI_ON]
gcode:
    {% set l = printer["gcode_macro _LUCI"] %}
    _LUCI_GOTO R={l.luci_max} G={l.luci_max} B={l.luci_max} W={l.strip_max} STATE=idle STEPS=20
    {% if printer.idle_timeout.state == "Idle" %}
        G4 P1
    {% endif %}

# Fa quello che faceva STOP_LED_EFFECTS: entrambe le strisce si
# spengono insieme con un fade-out di 0.5s (sempre verso 0, la
# luminosita' massima non c'entra quando si spegne).
[gcode_macro LUCI_OFF]
gcode:
    _LUCI_GOTO R=0.0 G=0.0 B=0.0 W=0.0 STATE=off STEPS=20

# Riscaldamento: LUCI va verso il rosso (0.25s) e poi pulsa
# rosso<->bianco ogni 2s, alla luminosita' massima impostata; STRIP
# si spegne (0.25s) e resta spenta.
[gcode_macro RISCALDA]
gcode:
    {% set l = printer["gcode_macro _LUCI"] %}
    _LUCI_GOTO R={l.luci_max} G=0.0 B=0.0 W=0.0 STATE=heat STEPS=10

# Pausa: entrambe le strisce vanno verso lo spento (0.25s) e poi
# respirano insieme ogni 3s (stesso periodo del linearfade 3
# originale), ciascuna fino alla propria luminosita' massima.
[gcode_macro WAIT]
gcode:
    _LUCI_GOTO R=0.0 G=0.0 B=0.0 W=0.0 STATE=wait STEPS=10

#####################################################################
# AVVIO - lasciato come l'originale
#####################################################################
[delayed_gcode startup]
initial_duration: 1
gcode:
    LUCI_ON
    G4 P1