[led STRIP]
white_pin: PB4          # il pin del connettore HE1 sulla tua scheda
cycle_time: 0.005
initial_WHITE: 0

[neopixel LUCI]
pin: PE6
chain_count: 60
color_order: GRB
# Parto da spento, cosi' all'avvio non c'e' il lampo grigio prima del fade-in
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

# ---------------------------------------------------------------
# EFFETTI
# ---------------------------------------------------------------

# Bianco fisso (stato "luci accese").
# Dissolvenza in entrata/uscita gestita da FADETIME nelle macro.
[led_effect IDLE]
autostart: false
frame_rate: 24
leds:
    neopixel:LUCI
layers:
    static 0 0 top (1.0,1.0,1.0)

[led_effect IDLE_strip]
autostart: false
frame_rate: 15
leds:
    led:STRIP
layers:
    static 0 0 top (1, 1, 1, 1)

# Effetto riscaldamento (rosso -> bianco)
[led_effect RISCALDA]
autostart: false
frame_rate: 60
leds:
    neopixel:LUCI
layers:
    gradient .5 1 top (1.0,0.0,0.0),(1.0,1.0,1.0)

# Bianco lampeggiante
[led_effect WAIT]
autostart: false
frame_rate: 24
leds:
    neopixel:LUCI
layers:
    linearfade 3 0 top (0.0,0.0,0.0),(1.0,1.0,1.0)

[led_effect WAIT_strip]
autostart: false
frame_rate: 15
leds:
    led:STRIP
layers:
    static 0 0 top (1, 1, 1, 1)

# ---------------------------------------------------------------
# AVVIO E MACRO (non bloccanti, sicure anche in stampa)
# ---------------------------------------------------------------

[delayed_gcode startup]
initial_duration: 1
gcode:
    Luci_ON
    G4 P1

# Fade-in di 3 secondi, poi restano accese bianche
[gcode_macro Luci_ON]
gcode:
    SET_LED_EFFECT EFFECT=IDLE REPLACE=1 FADETIME=.5
    SET_LED_EFFECT EFFECT=IDLE_strip REPLACE=1 FADETIME=.5
    {% if printer.idle_timeout.state == "Idle" %}
        G4 P1
    {% endif %}

# Fade-out di 2 secondi, poi si spengono
[gcode_macro Luci_OFF]
gcode:
    STOP_LED_EFFECTS FADETIME=.5
