[led STRIP]
white_pin: PB4          # il pin del connettore HE1 sulla tua scheda
cycle_time: 0.005
initial_WHITE: 0

[neopixel LUCI]
pin: PE6
chain_count: 60
color_order: GRB
# Parto da spento, cosi' all'avvio non c'e' il lampo grigio prima del fade-in
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

# ---------------------------------------------------------------
# EFFETTI
#
# led_effects non ha un modo per "congelare" un effetto statico:
# anche un colore fisso viene ricalcolato e ritrasmesso ad ogni
# frame per tutto il tempo che resta attivo. L'unica leva reale per
# alleggerire il carico sul Pi e' il frame_rate: per un colore che
# non cambia mai, pochi fps bastano e non si vede alcuna differenza.
# ---------------------------------------------------------------

# Bianco fisso (stato "luci accese"). Statico: non serve piu' di
# qualche fps, 24 era puro spreco di CPU per nulla di visibile.
# Dissolvenza in entrata/uscita gestita da FADETIME nelle macro.
[led_effect IDLE]
autostart: false
frame_rate: 2
leds:
    neopixel:LUCI
layers:
    static 0 0 top (1.0,1.0,1.0)

[led_effect IDLE_strip]
autostart: false
frame_rate: 2
leds:
    led:STRIP
layers:
    static 0 0 top (1, 1, 1, 0.5)

# Effetto riscaldamento (rosso -> bianco). Era il piu' pesante di
# tutti: 60 fps su 60 LED, proprio mentre la stampante sta gia'
# scaldando. Un gradient che scorre resta leggibile anche a 10 fps.
[led_effect RISCALDA]
autostart: false
frame_rate: 10
leds:
    neopixel:LUCI
layers:
    gradient .5 1 top (1.0,0.0,0.0),(1.0,1.0,1.0)

# Bianco lampeggiante (respiro di 3 secondi): troppo lento perche'
# serva fluidita' a 24 fps, 8 sono gia' impercettibili da 24.
[led_effect WAIT]
autostart: false
frame_rate: 8
leds:
    neopixel:LUCI
layers:
    linearfade 3 0 top (0.0,0.0,0.0),(1.0,1.0,1.0)

[led_effect WAIT_strip]
autostart: false
frame_rate: 2
leds:
    led:STRIP
layers:
    static 0 0 top (1, 1, 1, 0.5)

# ---------------------------------------------------------------
# AVVIO E MACRO (non bloccanti, sicure anche in stampa)
# ---------------------------------------------------------------

[delayed_gcode startup]
initial_duration: 5
gcode:
    #SET_BDPRESSURE NAME=bd_pa COMMAND=STOP
    #G4 P500
    #SET_BDPRESSURE NAME=bd_pa
    #COMMAND=RESET_PROBE
    Luci_ON
    G4 P1

# Fade-in di 3 secondi, poi restano accese bianche
[gcode_macro Luci_ON]
gcode:
    SET_LED_EFFECT EFFECT=IDLE REPLACE=1 FADETIME=.5
    SET_LED_EFFECT EFFECT=IDLE_strip REPLACE=1 FADETIME=.5
    {% if printer.idle_timeout.state == "Idle" %}
        G4 P1
    {% endif %}

# Fade-out di 2 secondi, poi si spengono
[gcode_macro Luci_OFF]
gcode:
    STOP_LED_EFFECTS FADETIME=.5
    
